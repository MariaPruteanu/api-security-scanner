name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install pyinstaller PyQt5 matplotlib reportlab fastapi uvicorn stripe python-dotenv requests sqlalchemy

    - name: Build (macOS / Linux)
      if: runner.os != 'Windows'
      run: |
        pyinstaller --onefile --windowed \
          --add-data "scanner:scanner" \
          --add-data "rules:rules" \
          --add-data "desktop_app:desktop_app" \
          --add-data "main.py:." \
          --add-data "license.txt:." \
          --add-data "run_report.py:." \
          --add-data "report_generator.py:." \
          --add-data "charts.py:." \
          --add-data "database.py:." \
          --add-data "stripe_config.py:." \
          --add-data "license_manager.py:." \
          launcher.py

    - name: Build (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --onefile --windowed ^
          --add-data "scanner;scanner" ^
          --add-data "rules;rules" ^
          --add-data "desktop_app;desktop_app" ^
          --add-data "main.py;." ^
          --add-data "license.txt;." ^
          --add-data "run_report.py;." ^
          --add-data "report_generator.py;." ^
          --add-data "charts.py;." ^
          --add-data "database.py;." ^
          --add-data "stripe_config.py;." ^
          --add-data "license_manager.py;." ^
          launcher.py

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: API-Security-Scanner-${{ runner.os }}
        path: dist/
