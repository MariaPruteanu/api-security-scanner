name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt  # если есть
      - name: Run tests
        run: pytest  # или ваша команда для тестов

  lint:
    name: Lint code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install flake8
        run: pip install flake8
      - name: Run flake8
        run: flake8 . --count --max-complexity=10 --statistics

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, lint]          # собираем только если тесты и линтер прошли
    # continue-on-error: true   # (опционально, можно убрать)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          docker build -t api-security-scanner:latest .
          docker build -f Dockerfile.vulnerable -t vulnerable-api:latest .
          echo "✅ Docker images built successfully"
