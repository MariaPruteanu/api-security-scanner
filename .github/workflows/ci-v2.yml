name: CI/CD Pipeline v2

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install 'pytest-asyncio>=0.23.0,<0.24'
    
    - name: Run tests with pytest
      run: |
        python -m pytest tests/ -v --tb=short --cov=scanner --cov-report=xml --cov-report=term-missing

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install linters
      run: |
        pip install black flake8 isort
    
    - name: Run Black
      run: |
        black --check --diff scanner/ tests/ || true
    
    - name: Run Flake8
      run: |
        flake8 scanner/ tests/ --max-line-length=120 --ignore=E501,W503 || true
    
    - name: Run isort
      run: |
        isort --check-only --diff scanner/ tests/ || true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run Bandit
      run: |
        pip install bandit
        bandit -r scanner/ -ll || true
    
    - name: Run Safety
      run: |
        pip install safety
        safety check -r requirements.txt || true
