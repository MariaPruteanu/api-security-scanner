name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov
    
    - name: Run tests with pytest
      run: |
        pytest --cov=scanner --cov-report=xml --cov-report=term-missing
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install linters
      run: |
        pip install black flake8 isort
    
    - name: Run Black (code formatter)
      run: |
        black --check --diff scanner/ tests/ || echo "Black formatting issues found"
    
    - name: Run Flake8 (linter)
      run: |
        flake8 scanner/ tests/ --max-line-length=120 --ignore=E501,W503 || echo "Flake8 issues found"
    
    - name: Run isort (import sorter)
      run: |
        isort --check-only --diff scanner/ tests/ || echo "isort issues found"

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, lint]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker build -t api-security-scanner:latest .
        docker build -f Dockerfile.vulnerable -t vulnerable-api:latest .
    
    - name: Test Docker Compose
      run: |
        docker-compose config
        echo "Docker Compose configuration is valid"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run Bandit (security linter)
      run: |
        pip install bandit
        bandit -r scanner/ -ll || echo "Security issues found"
    
    - name: Run Safety (dependency check)
      run: |
        pip install safety
        safety check -r requirements.txt || echo "Vulnerable dependencies found"
